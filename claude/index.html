<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Week Progress</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: #121212;
    color: #ffffff;
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    width: min(560px, 85vw);
    text-align: center;
  }

  h1 {
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #888888;
    margin-bottom: 1.5rem;
  }

  .bar-track {
    width: 100%;
    height: 28px;
    background: #2a2a2a;
    border-radius: 14px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97757, #e8956f);
    border-radius: 14px;
    transition: width 0.5s linear;
  }

  .percent {
    font-size: 2.25rem;
    font-variant-numeric: tabular-nums;
    margin-top: 1.25rem;
  }

  .detail {
    margin-top: 0.75rem;
    font-size: 0.85rem;
    color: #888888;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Week Elapsed</h1>
    <div class="bar-track">
      <div class="bar-fill" id="fill"></div>
    </div>
    <div class="percent" id="percent">—</div>
    <div class="detail" id="detail">resets Saturday 9:00 PM</div>
  </div>

<script>
  const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

  // Most recent Saturday at 9:00 PM local time.
  function cycleStart(now) {
    const start = new Date(now);
    start.setHours(21, 0, 0, 0);
    // Days since Saturday (getDay(): Sat = 6)
    start.setDate(start.getDate() - ((start.getDay() + 1) % 7));
    if (start > now) start.setDate(start.getDate() - 7);
    return start;
  }

  const fill = document.getElementById('fill');
  const percentEl = document.getElementById('percent');
  const detailEl = document.getElementById('detail');

  function update() {
    const now = new Date();
    const start = cycleStart(now);
    const elapsed = now - start;
    const pct = Math.min(100, (elapsed / WEEK_MS) * 100);

    fill.style.width = pct + '%';
    percentEl.textContent = pct.toFixed(4) + '%';

    const remaining = WEEK_MS - elapsed;
    const d = Math.floor(remaining / 86400000);
    const h = Math.floor((remaining % 86400000) / 3600000);
    const m = Math.floor((remaining % 3600000) / 60000);
    const s = Math.floor((remaining % 60000) / 1000);
    detailEl.textContent =
      `${d}d ${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s until reset (Sat 9:00 PM)`;
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
