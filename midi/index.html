<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Composer — WebEngine</title>
    <style>
      html, body { margin: 0; background: #111; color: #ddd; font-family: sans-serif; }
      #canvas { display: block; width: 100vw; height: 100vh; background: #000; }
      #status { position: fixed; top: 8px; left: 8px; font: 12px monospace; opacity: 0.7; pointer-events: none; }
      #log { position: fixed; bottom: 0; left: 0; right: 0; max-height: 30vh; overflow-y: auto;
             background: rgba(0,0,0,0.75); color: #bbb; font: 11px/1.3 monospace; padding: 4px 8px; }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="status">loading…</div>
    <pre id="log"></pre>
    <script>
      const statusEl = document.getElementById('status');
      const logEl = document.getElementById('log');
      const log = (line, cls) => {
        const row = document.createElement('div');
        row.textContent = line;
        if (cls) row.style.color = cls;
        logEl.appendChild(row);
        logEl.scrollTop = logEl.scrollHeight;
      };
      var Module = {
        canvas: document.getElementById('canvas'),
        print:    (text) => { console.log(text); log(text); },
        printErr: (text) => { console.warn(text); log(text, '#f88'); },
        setStatus: (text) => { statusEl.textContent = text || ''; },
        onAbort: (what) => { statusEl.textContent = 'aborted: ' + what; },
      };
    </script>
    <script async src="WebEngine.js"></script>
  </body>
</html>
